name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project (lint extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Ruff check
        run: |
          ruff --version
          ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project (test extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run tests with coverage
        run: |
          pytest --maxfail=1 --disable-warnings --cov=src --cov-report=term-missing --cov-fail-under=80 -q
