[project]
name = "b-room"
version = "0.1.0"
description = "My backtesting room"
authors = [{ name = "Rene Presedo", email = "presedo93@gmail.com" }]
requires-python = ">=3.13,<4.0"
readme = "README.md"

dependencies = [
  "streamlit (>=1.45.1,<2.0.0)",
  "loguru (>=0.7.3,<0.8.0)",
  "sqlmodel (>=0.0.24,<0.0.25)",
  "pydantic (>=2.11.7,<3.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
]

[dependency-groups]
dev = ["taskipy>=1.14.1,<2"]

[tool.taskipy.tasks]
b-room = "python -m streamlit run ./src/main.py"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
reportUnannotatedClassAttribute = 'none'
reportUnknownMemberType = 'none'
reportUnusedCallResult = 'none'
reportAny = 'none'
