[project]
name = "b-room"
version = "0.1.0"
description = "My backtesting room"
authors = [{ name = "Rene Presedo", email = "presedo93@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
  "streamlit (>=1.45.1,<2.0.0)",
  "loguru (>=0.7.3,<0.8.0)",
  "sqlmodel (>=0.0.24,<0.0.25)",
  "pydantic (>=2.11.7,<3.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
]

[tool.taskipy.tasks]
b-room = "python -m streamlit run ./src/main.py"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
taskipy = "^1.14.1"

[tool.basedpyright]
reportUnannotatedClassAttribute = 'none'
reportUnknownMemberType = 'none'
reportUnusedCallResult = 'none'
reportAny = 'none'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
