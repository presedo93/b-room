[project]
name = "b-room"
version = "0.1.0"
description = "My backtesting room"
authors = [{ name = "Rene Presedo", email = "presedo93@gmail.com" }]
requires-python = ">=3.13,<4.0"
readme = "README.md"

dependencies = [
  "streamlit (>=1.45.1,<2.0.0)",
  "loguru (>=0.7.3,<0.8.0)",
  "sqlmodel (>=0.0.24,<0.0.25)",
  "pydantic (>=2.11.7,<3.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
]

[dependency-groups]
test = [
  "pytest (>=8.3.0,<9.0.0)",
  "respx (>=0.21.1,<0.22.0)",
  "pytest-cov (>=5.0.0,<6.0.0)",
  "ruff (>=0.6.9,<0.7.0)",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
reportUnannotatedClassAttribute = 'none'
reportUnknownMemberType = 'none'
reportUnusedCallResult = 'none'
reportAny = 'none'
